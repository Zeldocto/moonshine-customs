# Keeps the Moonshine Customs Supabase project from auto-pausing.
# Free-tier projects pause after ~7 days without database activity,
# so this reads one skin row every 3 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: '29 16 * * *'   # daily
  workflow_dispatch:

permissions:
  actions: write              # needed to re-enable this workflow (see last step)
  contents: read

      - name: Write a heartbeat row
        env:
          SUPABASE_URL: https://jwkxwgccgjvcfpcousns.supabase.co
          SUPABASE_KEY: sb_publishable_JhcBz3eqOqEPLesvHRjH8g_nvCmz638
        run: |
          status=$(curl -s -o response.txt -w '%{http_code}' --max-time 30 \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "HTTP $status"
          cat response.txt; echo
          if [ "$status" != "200" ]; then exit 1; fi

      - name: Re-enable this workflow so GitHub's 60-day timer resets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
          echo "Workflow re-enabled; inactivity timer reset."
